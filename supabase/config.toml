[auth]
enable_anonymous_sign_ins = false

# Each handler authenticates with getUser; revocation validates the private integration key.
[functions.ecg-claim]
verify_jwt = false

[functions.ecg-refresh]
verify_jwt = false

[functions.ecg-handoff]
verify_jwt = false

[functions.ecg-logout]
verify_jwt = false

[functions.ecg-revocation]
verify_jwt = false

[functions.push-subscribe]
verify_jwt = false

[functions.push-dispatch]
verify_jwt = false

[functions.ecg-coffee]
verify_jwt = false
