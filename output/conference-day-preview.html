<div id="conference-day-preview">
  <div class="viz-controls">
    <label class="form-label" for="conference-preview-date">Preview date
      <select class="form-select" id="conference-preview-date">
        <option value="13–15 NOV">Before the conference</option>
        <option value="Day 1 · 13 Nov" selected>13 November 2026</option>
        <option value="Day 2 · 14 Nov">14 November 2026</option>
        <option value="Day 3 · 15 Nov">15 November 2026</option>
        <option value="13–15 NOV">After the conference</option>
      </select>
    </label>
  </div>
  <div class="viz-dotted-background" style="padding:20px 0">
  <div class="kamun-header">
    <div><strong>KAMUN 2026</strong><div class="kamun-subtitle">Black Forest Summit · Karlsruhe</div></div>
    <span class="kamun-badge" id="conference-preview-badge" aria-live="polite">Day 1 · 13 Nov</span>
  </div>
  </div>
</div>
<style>
#conference-day-preview .kamun-header {display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;padding:24px;background:#f4f1e8;color:#183e2e;font-family:Arial,sans-serif;border-radius:16px;}
#conference-day-preview .kamun-subtitle {font-size:13px;color:#62675f;margin-top:4px;}
#conference-day-preview .kamun-badge {background:#e3ece4;color:#183e2e;border-radius:999px;padding:8px 12px;font-size:14px;font-weight:600;white-space:nowrap;}
</style>
<script>
(() => {
  const root = document.getElementById('conference-day-preview');
  const select = root.querySelector('select');
  const badge = root.querySelector('#conference-preview-badge');
  select.addEventListener('change', () => { badge.textContent = select.value; });
})();
</script>
